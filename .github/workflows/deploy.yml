name: Sync Contributors from Weiyun
on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点自动跑一次
  workflow_dispatch: # 允许你在 GitHub 网页上手动点按钮运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 Action 自动 push 代码

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Wget and Parse
        run: |
          # 1. 直接用 wget 下载微云网页
          wget -O weiyun.html "https://sharechain.qq.com/07280414a680dbf2b32985ccf38aaba7?qq_aio_chat_type=2"
          
          # 2. 用 Python 解析提取头像和名字
          python3 -c "
          import re, json
          with open('weiyun.html', 'r', encoding='utf-8') as f:
              html = f.read()
              
          # 提取 json 里的 html_content
          match = re.search(r'\"html_content\":\"(.*?)\",\"share_flag\"', html)
          if match:
              content = match.group(1).replace('\\\\u003C', '<').replace('\\\\u003E', '>').replace('\\\\\"', '\"')
              
              # 提取图片和名字
              imgs = re.findall(r'<img src=\"(http[^\"]+)\"', content)
              names = re.findall(r'@([^<\s]+)', content)
              
              data = []
              for i in range(min(len(imgs), len(names))):
                  data.append({
                      'name': names[i].strip(),
                      'avatar': imgs[i].replace('http:', 'https:') # 强制 https 防裂图
                  })
                  
              with open('contributors.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(' 解析成功，已生成 contributors.json')
          else:
              print(' 未找到 html_content 字段')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add contributors.json
          # 如果文件有变化才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update contributors list" && git push)